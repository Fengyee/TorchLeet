id = "classification-metrics"
title = "Classification Metrics from Scratch"
description = "Implement confusion matrix, macro/micro precision-recall-F1, tie-aware ROC-AUC, step-wise average precision and expected calibration error in vectorized PyTorch."
difficulty = "medium"
