description = "Pack variable-length documents into fixed-length rows with first-fit-decreasing bin packing, then build the position ids, FlashAttention-style cu_seqlens, boundary-aware next-token labels and block-diagonal causal mask that make the packed batch exactly equivalent to running each document alone."
difficulty = "medium"
