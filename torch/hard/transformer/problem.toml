id = "transformer"
legacy_ids = ["v1-26"]
title = "Write a Transformer from Scratch"
description = "Build a Transformer encoder classifier from scratch — sinusoidal positional encoding, multi-head self-attention with a padding mask, position-wise feed-forward and pre-LN residual blocks, read out from a CLS token."
difficulty = "hard"
frequency = "emerging"   # very-likely | common | emerging (derived from company reports)
number = 26
set = "v1"
tracks = ["advanced"]

# GENERATED from the grader spec — edit python/torchleet/problems/*.py, then run: generate.py hints
hints = [
  "Shapes: everything below the model works on (batch, seq_len, embed_dim) and returns the same shape.",
  "In attention, split the last dim into (num_heads, head_dim) and move heads next to the batch: (B, H, T, head_dim). Scale the scores by 1/sqrt(head_dim) before the softmax over the *last* axis.",
  "PositionalEncoding builds a (max_len, d_model) table once with sin(pos/10000^(2i/d)) and cos(...), registers it as a buffer, and forward just adds the first seq_len rows to x.",
  "Padding: key_padding_mask is (B, T) bool with True at pad positions. Fill those *key* columns of the (B, H, T, T) scores with -inf before the softmax (mask[:, None, None, :]). In the model, prepend one False column for the CLS token before passing the mask to every layer.",
]

[notebooks]
question = "transformer.ipynb"
solution = "transformer_SOLN.ipynb"

[grading]
tier = "A"        # A = auto-graded by check(), C = not graded
entries = ["PositionalEncoding", "MultiHeadSelfAttention", "FeedForward", "TransformerEncoderLayer", "TransformerModel"]
