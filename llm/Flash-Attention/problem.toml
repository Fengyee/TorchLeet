id = "flash-attention"
title = "Flash Attention"
description = "Implement the FlashAttention forward pass — tiled attention with an online softmax (running max, running denominator, rescaled accumulator) and the logsumexp output — in PyTorch, then as a Triton kernel."
difficulty = "hard"
frequency = "emerging"   # very-likely | common | emerging (derived from company reports)
set = "v2"

# GENERATED from the grader spec — edit python/torchleet/problems/*.py, then run: generate.py hints
hints = [
  "Walk K/V in tiles and never build the full score matrix. Per query row keep a running max m, a running softmax denominator l and an unnormalized output accumulator, starting from -inf, 0 and 0.",
  "When a tile raises the max to m_new, rescale l and the accumulator by alpha = exp(m - m_new) before adding the tile: l = alpha*l + p.sum(-1), acc = alpha*acc + p @ V_tile, with p = exp(s - m_new).",
  "Divide the accumulator by l only once, after the last tile. L is the logsumexp of the scaled scores: m + log(l) at the end.",
]

[notebooks]
question = "flash-attention.ipynb"
solution = "flash-attention_SOLN.ipynb"

[grading]
tier = "A"        # A=auto-graded B=partial C=not auto-graded (SEEDED, confirm)
entries = ["flash_attention_pytorch"]
