id = "flash-attention-triton"
legacy_ids = ["v3-25"]
title = "Implement FlashAttention-2 in Triton"
description = "Write the tiled, fused attention kernel that computes exact attention in O(n) memory using online softmax in Triton."
difficulty = "expert"
frequency = "very-likely"   # very-likely | common | emerging (derived from company reports)
number = 25
set = "v3"
category = "gpu-systems"
tracks = ["advanced"]

# GENERATED from the grader spec — edit python/torchleet/problems/*.py, then run: generate.py hints
hints = [
  "Outer loop over Q blocks, inner loop over K,V blocks; the only matrix you ever materialize is the (block_q, block_kv) tile of scores.",
  "Carry running_max, running_sum and running_output per Q block. When a tile raises the max, rescale BOTH the running sum and the running output by exp(old_max - new_max) before adding the tile's contribution.",
  "Normalize once, after the inner loop: output = running_output / running_sum. The last block may be short, so slice with min(start + block, N).",
  "Causal: a K,V tile that starts after the Q tile's last row is pure future — skip it. Only tiles straddling the diagonal need a mask (-inf where key > query); the first tile always contains key 0, so no row is ever fully masked.",
]

